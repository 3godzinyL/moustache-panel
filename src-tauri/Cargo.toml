[package]
name = "moustache-control-center"
version = "2.0.0"
description = "Modern Windows overlay control center"
authors = ["3godziny"]
license = "MIT"
edition = "2021"

[lib]
name = "moustache_control_center_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
libloading = "0.8"
sysinfo = "0.33"
uuid = { version = "1", features = ["v4", "serde"] }

